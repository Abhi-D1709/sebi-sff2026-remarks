<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEBI · SFF 2026 · Visitor remarks (staff)</title>
<link rel="icon" href="favicon.png">
<style>
:root{--navy:#0A1838;--navy2:#060E26;--blue:#3C78FF;--bl:#5B95FF;--ink:#14213D;--muted:#5A6888;--bg:#EEF1F7;--ok:#1E7B4A;--warn:#9A5B00}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(180deg,#13285C,var(--navy) 60%,var(--navy2));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header img{height:38px}header h1{font-size:19px;font-weight:600;margin:0}header .sub{font-size:13px;color:#9FB3E0}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:#C9D4EE}
.dot{width:9px;height:9px;border-radius:50%;background:#2FD07A;box-shadow:0 0 0 0 rgba(47,208,122,.6);animation:p 2s infinite}
.dot.off{background:#E0A030;animation:none}@keyframes p{70%{box-shadow:0 0 0 8px rgba(47,208,122,0)}}
.btn{background:transparent;border:1px solid #5B6FA0;color:#E6ECFA;border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:1500px;margin:0 auto;padding:18px 22px 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 1px 3px rgba(10,24,56,.08)}
.stat b{display:block;font-size:34px;color:var(--navy);line-height:1.1}.stat span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px}
.chip{border:1.5px solid #C5CCDA;background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bar input{flex:1;min-width:200px;border:1.5px solid #C5CCDA;border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(10,24,56,.08);display:flex;flex-direction:column}
.card.new{animation:hl 3s ease-out}@keyframes hl{0%{box-shadow:0 0 0 4px var(--blue)}100%{box-shadow:0 1px 3px rgba(10,24,56,.08)}}
.ph{height:200px;background:#0A1838;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover}.ph .ini{color:#5B95FF;font-size:52px;font-weight:600}.ph.none{cursor:default}
.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-size:18px;font-weight:650;color:var(--navy)}.ds{font-size:14px;color:var(--muted)}
.rm{font-size:16.5px;line-height:1.5;border-left:3px solid var(--blue);padding-left:10px;margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;background:#EEF2FB;color:#2B3B66;border-radius:12px;padding:3px 9px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:6px;font-size:12.5px;color:var(--muted)}
.bdg{font-size:12px;font-weight:600;border-radius:5px;padding:3px 8px}.pub{background:#E3F4EA;color:var(--ok)}.int{background:#FFF1D6;color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:17px}
#gate{position:fixed;inset:0;background:linear-gradient(180deg,#13285C,var(--navy2));display:flex;align-items:center;justify-content:center;z-index:20}
#gate form{background:#fff;border-radius:14px;padding:30px;width:min(92vw,400px);text-align:center}
#gate h2{margin:0 0 6px;color:var(--navy);font-size:21px}#gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
#gate input{width:100%;font:inherit;font-size:18px;padding:13px;border:1.5px solid #AEB8CC;border-radius:8px;text-align:center}
#gate button{width:100%;margin-top:12px;padding:14px;font:inherit;font-size:17px;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:8px;cursor:pointer}
#gerr{color:#B3261E;font-size:14px;min-height:20px;margin-top:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:30;cursor:zoom-out}#lb img{max-width:94vw;max-height:92vh;border-radius:6px}
body.tv .bar,body.tv .btn.x{display:none}body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}body.tv .rm{font-size:20px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header .sub{display:none}}
</style>
</head>
<body>
<div id="gate"><form id="gf"><img src="sebi-logo.png" alt="SEBI" style="height:46px;background:#0A1838;padding:8px 14px;border-radius:8px"><h2 style="margin-top:14px">Visitor remarks – staff view</h2><p>SEBI kiosk team only. Enter the passcode.</p><input id="pc" type="password" autocomplete="current-password" autocapitalize="off" placeholder="Passcode" required><button>Open live view</button><div id="gerr" role="alert"></div></form></div>

<header><img src="sebi-logo.png" alt="SEBI"><div><h1>Visitor remarks · live</h1><div class="sub">SEBI Kiosk · India Pavilion · SFF 2026</div></div>
<div class="live"><span class="dot" id="dot"></span><span id="upd">Connecting…</span>
<button class="btn x" id="csv">Download CSV</button><button class="btn x" id="tv">TV mode</button><button class="btn x" id="out">Lock</button></div></header>

<main>
<div class="stats"><div class="stat"><b id="sT">–</b><span>Total remarks</span></div><div class="stat"><b id="sD">–</b><span>Today</span></div><div class="stat"><b id="sP">–</b><span>With photograph</span></div><div class="stat"><b id="sO">–</b><span>Cleared to publish</span></div></div>
<div class="bar" id="days"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No remarks yet. New submissions appear here automatically.</div>
</main>
<div id="lb"><img alt=""></div>

<script>
const FN="https://yrhltavzntfkmiydfror.supabase.co/functions/v1/staff-feed";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyaGx0YXZ6bnRma21peWRmcm9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MDk5NDIsImV4cCI6MjEwOTk4NTk0Mn0.5BGJNJR0uecPxolz_tD8xuNwjlt01KsbipKHEadZ6O0";
const $=i=>document.getElementById(i);
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let PASS=ss.get('sff_pc'),ROWS=[],SEEN=new Set(),FIRST=true,F={day:'all',pub:false,photo:false,q:''},timer;
const ATTR={name_designation:'Name & designation',designation_organisation:'Designation & org.',internal_only:'Internal only'};
const sgt=d=>new Date(d).toLocaleString('en-SG',{timeZone:'Asia/Singapore',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
const dayKey=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Asia/Singapore'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  try{
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({passcode:PASS})});
    if(r.status===401){lock('Incorrect passcode.');return;}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();ROWS=j.rows||[];$('gate').style.display='none';
    $('dot').classList.remove('off');$('upd').textContent='Updated '+new Date().toLocaleTimeString('en-SG',{timeZone:'Asia/Singapore',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})+' SGT';
    render();
  }catch(e){$('dot').classList.add('off');$('upd').textContent='Offline – retrying…';}
}
function lock(msg){ss.del('sff_pc');PASS=null;clearInterval(timer);$('gate').style.display='flex';$('gerr').textContent=msg||'';}
function render(){
  const today=dayKey(new Date());
  $('sT').textContent=ROWS.length;$('sD').textContent=ROWS.filter(r=>dayKey(r.created_at)===today).length;
  $('sP').textContent=ROWS.filter(r=>r.photo_path).length;$('sO').textContent=ROWS.filter(r=>r.consent_publish).length;
  const days=[...new Set(ROWS.map(r=>dayKey(r.created_at)))].sort();
  const chip=(k,l,on)=>`<button class="chip${on?' on':''}" data-k="${k}">${l}</button>`;
  $('days').innerHTML=chip('day:all','All days',F.day==='all')+days.map(d=>chip('day:'+d,new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}),F.day===d)).join('')
    +chip('pub','Cleared to publish',F.pub)+chip('photo','With photograph',F.photo)+`<input id="q" placeholder="Search name, organisation, country, remark…" value="${esc(F.q)}">`;
  let rows=ROWS.filter(r=>(F.day==='all'||dayKey(r.created_at)===F.day)&&(!F.pub||r.consent_publish)&&(!F.photo||r.photo_path));
  if(F.q){const q=F.q.toLowerCase();rows=rows.filter(r=>[r.full_name,r.organisation,r.designation,r.country,r.remarks].join(' ').toLowerCase().includes(q));}
  $('empty').hidden=rows.length>0;
  $('grid').innerHTML=rows.map(r=>{
    const isNew=!FIRST&&!SEEN.has(r.ref_no);
    const ini=(r.full_name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    return `<article class="card${isNew?' new':''}">
      <div class="ph${r.photo_url?'':' none'}" ${r.photo_url?`data-src="${esc(r.photo_url)}"`:''}>${r.photo_url?`<img loading="lazy" src="${esc(r.photo_url)}" alt="Photograph of ${esc(r.full_name)}">`:`<span class="ini">${esc(ini)}</span>`}</div>
      <div class="bd"><div class="nm">${esc([r.title,r.full_name].filter(Boolean).join(' '))}</div>
      <div class="ds">${esc(r.designation)} · ${esc(r.organisation)} · ${esc(r.country)}</div>
      <div class="rm">${esc(r.remarks)}</div>
      ${(r.initiatives||[]).length?`<div class="tags">${r.initiatives.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>`:''}
      <div class="meta"><span class="bdg ${r.consent_publish?'pub':'int'}">${r.consent_publish?'Publishable':'Internal only'}</span><span>${esc(ATTR[r.attribution]||'')}</span><span>· SFF-${String(r.ref_no).padStart(3,'0')} · ${sgt(r.created_at)} · ${esc(r.channel)}</span>${r.email?`<span>· ✉ ${esc(r.email)}</span>`:''}</div></div></article>`;}).join('');
  ROWS.forEach(r=>SEEN.add(r.ref_no));FIRST=false;
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(c){const k=c.dataset.k;if(k.startsWith('day:'))F.day=k.slice(4);else F[k]=!F[k];render();return;}
  const p=e.target.closest('.ph[data-src]');if(p){$('lb').querySelector('img').src=p.dataset.src;$('lb').style.display='flex';return;}
  if(e.target.closest('#lb'))$('lb').style.display='none';
});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('q');q.focus();q.setSelectionRange(pos,pos);}});
$('gf').addEventListener('submit',e=>{e.preventDefault();PASS=$('pc').value.trim().toLowerCase();$('gerr').textContent='Checking…';ss.set('sff_pc',PASS);start();});
$('out').onclick=()=>lock();
$('tv').onclick=()=>{document.body.classList.toggle('tv');document.documentElement.requestFullscreen?.().catch(()=>{});};
$('csv').onclick=()=>{
  const cols=['ref_no','created_at','channel','title','full_name','designation','organisation','country','email','initiatives','remarks','attribution','consent_publish','photo_path'];
  const q=v=>'"'+String(Array.isArray(v)?v.join('; '):(v??'')).replace(/"/g,'""')+'"';
  const csv='﻿'+cols.join(',')+'\n'+ROWS.map(r=>cols.map(c=>q(c==='created_at'?sgt(r[c]):r[c])).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='SFF2026_Remarks_'+dayKey(new Date())+'.csv';a.click();
};
function start(){load();clearInterval(timer);timer=setInterval(load,20000);}
if(PASS)start();
</script>
</body>
</html>
